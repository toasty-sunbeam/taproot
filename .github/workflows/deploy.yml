name: Deploy

# Deploys the Worker to Cloudflare.
#   - Automatically on every push to main (i.e. when a PR is merged).
#   - Manually from the Actions tab ("Run workflow"), the GitHub mobile app,
#     or anything that can call the workflow_dispatch API.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account ID
#
# Worker secrets such as TAPROOT_AUTH_TOKEN are stored on Cloudflare and are
# untouched by deploys; they are still set with `wrangler secret put`.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the one in flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Don't ship a build that fails its own checks.
      - run: npm run typecheck
      - run: npm test

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
